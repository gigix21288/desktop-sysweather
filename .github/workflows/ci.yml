name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gjs, GLib tools and dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gir1.2-soup-3.0 libglib2.0-bin libglib2.0-dev-bin dpkg-dev gettext

      - name: Unit tests (gjs)
        run: tests/run.sh

      - name: Build zip and deb
        run: ./build.py

      - name: Check the zip against metadata.json
        run: |
          set -e
          unzip -l dist/*.shell-extension.zip | grep -q 'metadata.json'
          python3 -c "import json; m=json.load(open('extension/metadata.json')); print('version', m['version-name'], '(', m['version'], ')')"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          META=$(python3 -c "import json; print(json.load(open('extension/metadata.json'))['version-name'])")
          if [ "$META" != "$VERSION" ]; then
            echo "tag $TAG does not match metadata version-name $META" >&2
            exit 1
          fi
          # the CHANGELOG section of this version becomes the release notes
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then echo "Release $TAG" > notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.deb --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.deb --title "$VERSION" --notes-file notes.md --verify-tag
          fi
